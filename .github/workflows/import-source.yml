name: Import project source
on:
  push:
    paths: ['.github/workflows/import-source.yml', 'orderflow-source.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Expand reviewed source archive
        run: |
          test -f orderflow-source.zip
          unzip -o orderflow-source.zip
          git rm orderflow-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Import tested FastAPI and React application'
          git push
