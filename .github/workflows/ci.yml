name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Python ${{ matrix.python }} / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: orderflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/constraints.txt
      - run: python -m pip install -c constraints.txt -e '.[dev]'
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy app
      - name: Tests with coverage
        env:
          TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'postgresql+psycopg://orderflow:test-password@localhost:5432/orderflow_test' || '' }}
        run: python -m pytest --cov=app --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -c ../backend/constraints.txt -e ../backend
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose up --build --wait --wait-timeout 180
      - name: Exercise the composed application
        run: python scripts/smoke.py http://127.0.0.1:8080
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
