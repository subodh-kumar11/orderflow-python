server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location /docs { proxy_pass http://api:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://api:8000; }
    location = /health { proxy_pass http://api:8000; }
    location / { try_files $uri $uri/ /index.html; }
}
