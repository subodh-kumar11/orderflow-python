[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "orderflow-api"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.1,<2.2", "psycopg[binary]>=3.2,<4",
  "APScheduler>=3.11,<4", "httpx2>=2.13,<3",
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2"]
[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true
[tool.coverage.run]
source = ["app"]
[tool.coverage.report]
show_missing = true
fail_under = 85
